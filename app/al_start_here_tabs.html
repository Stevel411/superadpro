<!DOCTYPE html>
<html lang="en"><head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Start Here — AdvantageLife</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@500;600;700;800;900&display=swap" rel="stylesheet">
<style>
  :root{--navy:#0a1f52;--navy2:#12388f;--red:#c8102e;--grn:#2ecc71;--ink:#0d1230;--dim:#5a6584;--line:#e7ebf6}
  *{box-sizing:border-box}
  html,body{margin:0;padding:0}
  body{font-family:'Inter',sans-serif;color:var(--ink);background:#fbfcff;min-height:100vh;
    background-image:radial-gradient(110% 45% at 90% -6%,rgba(46,204,113,.07),transparent 60%),radial-gradient(110% 40% at 4% -3%,rgba(18,56,143,.09),transparent 55%);background-attachment:fixed}
  .wrap{max-width:1200px;margin:0 auto;padding:16px 20px 60px}
  .back{display:inline-flex;align-items:center;gap:6px;font-size:13px;font-weight:800;color:#fff;background:var(--navy);border-radius:9px;padding:8px 14px;text-decoration:none;margin-bottom:14px}
  .head{text-align:center;margin-bottom:4px}
  h1{font-weight:900;font-size:32px;letter-spacing:-.8px;margin:0}h1 .g{color:var(--grn)}
  .sub{font-size:15px;color:var(--dim);font-weight:600;margin:0 auto;max-width:560px;line-height:1.55}
  .sub.below{text-align:center;margin-top:20px;max-width:600px}
  .sub.below b{color:var(--navy)}
  /* tabs */
  .tabs{display:flex;gap:8px;justify-content:center;margin:16px 0 20px}
  .tab{display:inline-flex;align-items:center;gap:8px;font-family:inherit;font-weight:800;font-size:15px;
    color:var(--dim);background:#fff;border:2px solid var(--line);border-radius:100px;padding:12px 24px;cursor:pointer;transition:all .18s}
  .tab:hover{border-color:#cdd8f5}
  .tab.on{color:#fff;background:var(--grn);border-color:var(--grn);box-shadow:0 10px 24px -12px rgba(46,204,113,.6)}
  .tab.on.blue{background:var(--navy);border-color:var(--navy);box-shadow:0 10px 24px -12px rgba(10,31,82,.5)}
  /* panels */
  .panel{display:none}.panel.on{display:block}
  .vidbox{max-width:1040px;margin:0 auto;border-radius:18px;overflow:hidden;box-shadow:0 24px 60px -30px rgba(10,31,82,.5);background:var(--navy)}
  .vidbox video{width:100%;display:block}
  /* guide iframe — scale-to-fit (fixed 1120x965 design scaled to container width, no scrollbars) */
  .guidewrap{position:relative;width:100%;border-radius:18px;overflow:hidden;box-shadow:0 24px 60px -30px rgba(10,31,82,.4);background:#fff}
  .guidewrap iframe{display:block;width:1168px;height:1180px;border:0;transform-origin:top left;opacity:0;transition:opacity .25s ease;overflow:hidden}
  .guidewrap iframe.ready{opacity:1}
  /* loading placeholder while the guide scales in */
  .guideload{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;color:var(--dim);font-weight:700;font-size:14px}
  .guideload::after{content:"";width:26px;height:26px;margin-left:10px;border:3px solid var(--line);border-top-color:var(--navy2);border-radius:50%;animation:spin .8s linear infinite}
  @keyframes spin{to{transform:rotate(360deg)}}
  @media(max-width:640px){h1{font-size:24px}.tab{padding:11px 18px;font-size:14px}}
</style></head>
<body>
<div class="wrap">
  <a class="back" href="/dashboard"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg>Dashboard</a>

  <div class="head">
    <h1>Start <span class="g">here</span></h1>
  </div>

  <div class="tabs">
    <button class="tab on" id="tabWatch" onclick="showTab('watch')">
      <svg width="17" height="17" viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg>
      Watch
    </button>
    <button class="tab blue" id="tabSteps" onclick="showTab('steps')">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M9 6h11M9 12h11M9 18h11M4 6h.01M4 12h.01M4 18h.01"/></svg>
      Step-by-step
    </button>
  </div>

  <div class="panel on" id="panelWatch">
    <div class="vidbox">
      <video controls preload="metadata" playsinline poster="/static/videos/your-effort-poster.jpg">
        <source src="/static/videos/your-effort.mp4" type="video/mp4">
      </video>
    </div>
    <div class="sub below">New to AdvantageLife? This quick walkthrough shows you exactly how to get set up and earning. Prefer to go at your own pace? Switch to the <b>step-by-step</b> guide above.</div>
  </div>

  <div class="panel" id="panelSteps">
    <div class="guidewrap" style="min-height:400px">
      <div class="guideload" id="guideLoad">Loading guide</div>
      <iframe id="guideFrame" src="" title="Step-by-step activation guide" loading="lazy" scrolling="no"></iframe>
    </div>
  </div>
</div>

<script>
  var GUIDE_W=1168, GUIDE_H=1180;
  var guideLoaded=false, guideReady=false;
  function fitGuide(){
    var wrap=document.querySelector('.guidewrap');
    var frame=document.getElementById('guideFrame');
    if(!wrap||!frame)return;
    var w=wrap.clientWidth;
    if(!w) return; // panel not visible yet — skip (avoids scaling to 0)
    var scale=w/GUIDE_W;
    frame.style.transform='scale('+scale+')';
    if(guideReady) wrap.style.height=(GUIDE_H*scale)+'px';
  }
  function onGuideLoad(){
    // The guide is a design-tool export that ships its own grey "mat" (an #eef1f7
    // body + 36/24/52px padding + a fixed-width rounded card). It's same-origin, so
    // strip that mat here — the white card then fills the panel edge-to-edge — and
    // measure its true height so the panel fits exactly with no scrollbars.
    guideReady=true;
    var frame=document.getElementById('guideFrame');
    var load=document.getElementById('guideLoad');
    try{
      var doc=frame.contentDocument;
      var st=doc.createElement('style');
      // :not([id]) avoids the bundler's fixed #__bundler_thumbnail / #__bundler_err overlays
      st.textContent=
        'html,body{background:#fff!important}'+
        'body>div:not([id]){padding:0!important;background:#fff!important;min-height:0!important}'+
        'body>div:not([id])>div{width:100%!important;margin:0!important;border-radius:0!important;box-shadow:none!important}';
      doc.head.appendChild(st);
    }catch(e){/* if ever cross-origin, fall back to the design default */}
    function measureAndReveal(){
      try{
        var d=frame.contentDocument;
        var h=(d&&d.body)?d.body.scrollHeight:0;
        if(h>200){ GUIDE_H=Math.ceil(h); frame.style.height=GUIDE_H+'px'; }
      }catch(e){}
      fitGuide();
      frame.classList.add('ready');
      if(load) load.style.display='none';
    }
    // let the injected style + React paint settle, then measure; re-measure once more as a guard
    requestAnimationFrame(function(){ requestAnimationFrame(measureAndReveal); });
    setTimeout(measureAndReveal, 400);
  }
  function showTab(which){
    var w=which==='watch';
    document.getElementById('tabWatch').classList.toggle('on',w);
    document.getElementById('tabSteps').classList.toggle('on',!w);
    document.getElementById('panelWatch').classList.toggle('on',w);
    document.getElementById('panelSteps').classList.toggle('on',!w);
    if(!w){
      var gf=document.getElementById('guideFrame');
      if(!guideLoaded){
        // wire the load handler BEFORE setting src, so we catch the load event
        gf.onload=onGuideLoad;
        gf.src='/start-here/guide';
        guideLoaded=true;
      } else if(guideReady){
        // already loaded — just re-fit for the current width
        fitGuide();
      }
      // pause the video when leaving the Watch tab
      var v=document.querySelector('#panelWatch video');if(v&&!v.paused)v.pause();
    }
  }
  window.addEventListener('resize', function(){ if(guideReady) fitGuide(); });
</script>
</body></html>
