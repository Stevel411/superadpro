<!DOCTYPE html>
<html lang="en"><head>
<meta charset="utf-8"/><meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>Get Started — AdvantageLife</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@500;600;700;800;900&display=swap" rel="stylesheet"/>
<style>
  :root{--navy:#0a1f52;--navy2:#12388f;--red:#c8102e;--red2:#ff2743;--grn:#2ecc71;--grn2:#0b7a3e;--ink:#0d1230;--dim:#5a6584;--line:#e6ecf5}
  *{box-sizing:border-box}
  body{margin:0;background:#eef2fb;font-family:'Inter',system-ui,sans-serif;color:var(--ink)}
  .top{background:#fff;border-bottom:1px solid var(--line);padding:14px 18px;display:flex;align-items:center;gap:12px;position:sticky;top:0;z-index:5}
  .back{display:inline-flex;align-items:center;gap:7px;color:var(--navy);text-decoration:none;font-weight:800;font-size:14px}
  .brand{margin-left:auto;font-weight:900;font-size:17px;letter-spacing:-.02em}.brand b{color:var(--navy)}.brand span{color:var(--red)}
  .wrap{max-width:760px;margin:0 auto;padding:24px 16px 70px}
  h1{font-size:clamp(24px,5vw,34px);font-weight:900;letter-spacing:-.03em;color:var(--navy);margin:4px 0 4px}
  .sub{font-size:15px;color:var(--dim);font-weight:600;margin:0 0 22px;line-height:1.5}

  .hero{display:flex;align-items:center;gap:16px;background:var(--navy);border-radius:18px;padding:18px 20px;margin-bottom:22px;cursor:pointer;box-shadow:0 20px 44px -26px rgba(10,31,82,.6)}
  .hero .ic{width:58px;height:58px;border-radius:50%;background:linear-gradient(120deg,var(--red),var(--red2));display:flex;align-items:center;justify-content:center;flex:none;box-shadow:0 10px 22px -10px rgba(200,16,46,.7)}
  .hero .t{flex:1;min-width:0}.hero .t b{display:block;color:#fff;font-size:16px;font-weight:900}.hero .t span{display:block;color:#aebcf0;font-size:13px;font-weight:600;margin-top:2px}
  .hero .wave{display:none;align-items:center;gap:3px;height:22px}
  .hero.playing .wave{display:flex}.hero.playing .tri{display:none}
  .wave i{width:3px;background:#7fb0ff;border-radius:2px;animation:bounce 1s ease-in-out infinite}
  .wave i:nth-child(1){height:8px}.wave i:nth-child(2){height:18px;animation-delay:.1s}.wave i:nth-child(3){height:11px;animation-delay:.2s}.wave i:nth-child(4){height:21px;animation-delay:.3s}.wave i:nth-child(5){height:9px;animation-delay:.15s}
  @keyframes bounce{0%,100%{transform:scaleY(.5)}50%{transform:scaleY(1)}}

  .step{background:#fff;border:1px solid var(--line);border-radius:16px;padding:16px 18px;margin-bottom:12px;display:flex;gap:15px;align-items:flex-start;box-shadow:0 12px 30px -24px rgba(10,31,82,.4)}
  .num{width:36px;height:36px;border-radius:10px;background:rgba(18,56,143,.1);color:var(--navy2);font-weight:900;font-size:16px;display:flex;align-items:center;justify-content:center;flex:none}
  .sc{flex:1;min-width:0}
  .sc h3{margin:0 0 3px;font-size:16px;font-weight:900;color:var(--ink);display:flex;align-items:center;gap:9px;flex-wrap:wrap}
  .sc p{margin:0 0 12px;font-size:13.5px;color:var(--dim);font-weight:600;line-height:1.45}
  .actions{display:flex;gap:9px;flex-wrap:wrap}
  .listen{display:inline-flex;align-items:center;gap:7px;background:#eef2fb;border:1px solid #dbe3f4;border-radius:10px;padding:9px 14px;font-size:13px;font-weight:800;color:var(--navy);cursor:pointer}
  .listen.playing{background:var(--navy);color:#fff;border-color:var(--navy)}
  .listen.playing .lwave{display:flex}.listen.playing .lic{display:none}
  .lwave{display:none;align-items:center;gap:2.5px;height:15px}
  .lwave i{width:2.5px;background:#7fb0ff;border-radius:2px;animation:bounce 1s ease-in-out infinite}
  .lwave i:nth-child(2){height:12px;animation-delay:.1s}.lwave i:nth-child(3){height:8px;animation-delay:.2s}.lwave i:nth-child(4){height:14px;animation-delay:.3s}
  .do{display:inline-flex;align-items:center;gap:6px;background:linear-gradient(120deg,var(--red),var(--red2));color:#fff;border-radius:10px;padding:9px 15px;font-size:13px;font-weight:900;text-decoration:none;box-shadow:0 8px 18px -8px rgba(200,16,46,.5)}
  .powertag{display:inline-flex;align-items:center;gap:4px;background:var(--red);color:#fff;font-size:9.5px;font-weight:900;letter-spacing:.03em;text-transform:uppercase;padding:3px 8px;border-radius:6px}
  .step.power{border:2px solid var(--red);background:linear-gradient(180deg,#fff,#fff6f7)}
  .step.power .num{background:linear-gradient(120deg,var(--red),var(--red2));color:#fff}
  .footnote{margin-top:20px;font-size:12px;color:var(--dim);text-align:center;line-height:1.5}
</style></head>
<body>
  <div class="top">
    <a class="back" href="/dashboard"><svg width="18" height="18" viewBox="0 0 24 24" fill="none"><path d="M15 18l-6-6 6-6" stroke="#0a1f52" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></svg>Dashboard</a>
    <div class="brand"><b>Advantage</b><span>Life</span></div>
  </div>
  <div class="wrap">
    <h1>Get started</h1>
    <p class="sub">A few steps to your first result. Not sure what to do? Tap <b>Listen</b> on any step and we'll walk you through it.</p>

    <div class="hero" id="hero" data-key="overview">
      <span class="ic">
        <svg class="tri" width="26" height="26" viewBox="0 0 24 24" fill="#fff"><path d="M8 5v14l11-7z"/></svg>
        <span class="wave"><i></i><i></i><i></i><i></i><i></i></span>
      </span>
      <div class="t"><b>Hear how this works</b><span>A 60-second overview — press play</span></div>
    </div>

    <div id="steps"></div>

    <p class="footnote">There are no guarantees and no income is promised — what you get depends on the work you put in.</p>
  </div>

<script>
(function(){
  var STEPS=[
    {key:'receiving',num:1,title:'Add your receiving method',desc:'Choose how you\u2019d like to get paid \u2014 there are several ways, from crypto to popular payment apps.',link:'/payout-methods',cta:'Add method'},
    {key:'ad',num:2,title:'Create your ad',desc:'Add the video you want people to watch \u2014 this becomes your advert on the platform.',link:'/create-campaign',cta:'Create ad'},
    {key:'package',num:3,title:'Purchase your package',desc:'This turns your ad into a live campaign and qualifies you to start earning.',link:'/packs',cta:'Choose package'},
    {key:'watch',num:4,title:'Do your daily Watch to Earn',desc:'Watch your videos each day to stay qualified to earn and withdraw.',link:'/watch',cta:'Watch now'},
    {key:'share',num:5,title:'Share your Showcase & Banner pages',desc:'The weekly engine. Share publicly \u2014 your videos rotate so one post stays fresh all week, sending real viewers to your offer.',link:'/dashboard',cta:'Share now',power:true}
  ];
  var manifest={}, audio=new Audio(), current=null;

  function stopAll(){
    audio.pause();
    if(current){ current.el.classList.remove('playing'); current=null; }
  }
  function play(key, el){
    if(current && current.key===key){ stopAll(); return; }   // toggle off
    stopAll();
    var url=manifest[key]; if(!url) return;
    audio.src=url; audio.play().catch(function(){});
    el.classList.add('playing'); current={key:key, el:el};
  }
  audio.addEventListener('ended', stopAll);

  // build steps
  var wrap=document.getElementById('steps');
  STEPS.forEach(function(s){
    var d=document.createElement('div'); d.className='step'+(s.power?' power':'');
    d.innerHTML=
      '<div class="num">'+s.num+'</div>'+
      '<div class="sc"><h3>'+s.title+(s.power?' <span class="powertag">\u26a1 Most powerful</span>':'')+'</h3>'+
      '<p>'+s.desc+'</p>'+
      '<div class="actions">'+
        '<span class="listen" data-key="'+s.key+'">'+
          '<svg class="lic" width="15" height="15" viewBox="0 0 24 24" fill="none"><path d="M11 5L6 9H2v6h4l5 4V5z" fill="#0a1f52"/><path d="M16 8a5 5 0 010 8M19 5a9 9 0 010 14" stroke="#0a1f52" stroke-width="2" stroke-linecap="round"/></svg>'+
          '<span class="lwave"><i></i><i></i><i></i><i></i></span> Listen</span>'+
        '<a class="do" href="'+s.link+'">'+s.cta+' \u2192</a>'+
      '</div></div>';
    wrap.appendChild(d);
  });

  document.getElementById('hero').addEventListener('click', function(){ play('overview', this); });
  document.querySelectorAll('.listen').forEach(function(b){
    b.addEventListener('click', function(){ play(b.getAttribute('data-key'), b); });
  });

  // language: follow ?lang= or default en
  var lang=(new URLSearchParams(location.search).get('lang'))||'en';
  fetch('/api/al/voice-manifest?lang='+encodeURIComponent(lang))
    .then(function(r){return r.json();})
    .then(function(j){ manifest=(j&&j.voices)||{}; })
    .catch(function(){});
})();
</script>
</body></html>
